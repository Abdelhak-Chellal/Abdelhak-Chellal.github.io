<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Abdelhak Chellal</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <style>
    :root {
      --blue: #3b82f6;
      --blue-soft: #1e3a8a;
      --ink: #f0f0f0;
      --ink-2: #d1d5db;
      --ink-3: #9ca3af;
      --border: #2d3748;
      --bg: #0f1419;
      --bg-alt: #1a1f2e;
      --serif: 'Instrument Serif', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
      --max: 1200px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 18px; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── LAYOUT ── */
    .container {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 2.5rem;
    }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15, 20, 25, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }
    .nav-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: .01em;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.6rem;
    }
    .nav-links {
      display: flex;
      gap: 1.4rem;
      list-style: none;
    }
    .nav-links a {
      font-size: 0.95rem;
      color: var(--ink-3);
      text-decoration: none;
      transition: color .15s;
    }
    .nav-links a:hover { color: var(--ink); }
    .lang-sw {
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg-alt);
    }
    .lang-sw button {
      background: none; border: none; cursor: pointer;
      padding: .3rem .7rem;
      font-family: var(--sans);
      font-size: .75rem; font-weight: 600;
      color: var(--ink-3);
      transition: all .2s;
    }
    .lang-sw button.on { background: var(--blue); color: #fff; border-radius: 5px; margin: 2px; }

    /* ── HERO ── */
    .hero {
      padding: 7.5rem 0 5.5rem;
      border-bottom: 1px solid var(--border);
    }
    .hero-inner {
      display: flex;
      align-items: flex-start;
      gap: 5rem;
    }
    .hero-photo {
      width: 240px; height: 240px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-soft) 100%);
      border: 3px solid var(--blue);
      box-shadow: 0 20px 48px rgba(59, 130, 246, 0.35);
    }
    .hero-label {
      font-size: 1rem;
      font-weight: 500;
      color: var(--blue);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .hero-name {
      font-family: var(--serif);
      font-size: 4.5rem;
      font-weight: 400;
      line-height: 1.05;
      color: var(--ink);
      margin-bottom: 1.8rem;
      letter-spacing: 0.03em;
    }
    .hero-bio {
      font-size: 1.3rem;
      color: var(--ink-2);
      line-height: 2;
      max-width: 650px;
    }
    .hero-bio a {
      color: var(--blue);
      text-decoration: none;
      border-bottom: 1px solid rgba(59, 130, 246, 0.4);
      transition: all .2s;
    }
    .hero-bio a:hover { 
      border-bottom-color: var(--blue);
      opacity: 0.8;
    }
    .hero-loc {
      display: flex; align-items: center; gap: .4rem;
      margin-top: 1.3rem;
      font-size: 1.05rem;
      color: var(--ink-3);
    }
    .hero-loc svg { width: 18px; height: 18px; }

    /* ── SECTIONS ── */
    .section {
      padding: 5rem 0;
      border-bottom: 1px solid var(--border);
    }
    .section:last-of-type { border-bottom: none; }
    .section-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 3rem;
    }

    /* ── TIMELINE ── */
    .timeline { display: flex; flex-direction: column; gap: 0; }
    .tl-year-group { margin-bottom: 0; }
    .tl-item {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 0 2rem;
      padding: 1.5rem 0;
      border-top: 1px solid var(--border);
    }
    .tl-item:first-child { border-top: none; }
    .tl-meta { padding-top: .1rem; }
    .tl-date {
      font-size: 1rem;
      color: var(--ink-3);
      font-weight: 400;
      line-height: 1.6;
    }
    .tl-tag {
      display: inline-block;
      margin-top: .4rem;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: .3rem .7rem;
      border-radius: 4px;
      background: rgba(59, 130, 246, 0.2);
      color: var(--blue);
    }
    .tl-tag.research { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .tl-tag.industry  { background: rgba(249, 115, 22, 0.2); color: #fb923c; }
    .tl-content h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: .25rem;
      line-height: 1.45;
    }
    .tl-content .where {
      font-size: 1.08rem;
      color: var(--ink-2);
    }
    .tl-content .where a {
      color: inherit;
      text-decoration-color: var(--border);
      text-underline-offset: 2px;
    }
    .tl-content .where a:hover { color: var(--blue); }
    .tl-content p {
      margin-top: .5rem;
      font-size: 1.02rem;
      color: var(--ink-3);
      line-height: 1.8;
    }

    /* ── INTERESTS ── */
    .interests-grid {
      display: flex; flex-wrap: wrap; gap: .5rem;
    }
    .interest-chip {
      font-size: 1rem;
      color: var(--ink-2);
      padding: .6rem 1.3rem;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--bg-alt);
      transition: all .2s;
    }
    .interest-chip:hover { 
      border-color: var(--blue);
      color: var(--blue);
      background: rgba(59, 130, 246, 0.1);
    }

    /* ── CV ── */
    .cv-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap;
    }
    .cv-desc {
      font-size: 1.1rem;
      color: var(--ink-2);
      line-height: 1.85;
    }
    .cv-btns { display: flex; gap: .7rem; flex-shrink: 0; }
    .btn {
      display: inline-flex; align-items: center; gap: .35rem;
      font-family: var(--sans);
      font-size: .9rem; font-weight: 500;
      text-decoration: none; border-radius: 6px;
      padding: .7rem 1.4rem;
      transition: all .15s;
    }
    .btn-primary {
      background: var(--blue); color: #fff;
      border: 1px solid var(--blue);
    }
    .btn-primary:hover { 
      background: #2563eb;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    .btn-ghost {
      background: var(--bg-alt); color: var(--ink-2);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { 
      border-color: var(--blue);
      color: var(--blue);
      background: rgba(59, 130, 246, 0.05);
    }

    /* ── CONTACT ── */
    .contact-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 1rem;
    }
    .contact-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      aspect-ratio: 1;
      padding: 0.8rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--ink-2);
      font-size: 0.75rem;
      font-weight: 500;
      transition: all .2s;
      background: var(--bg-alt);
      position: relative;
    }
    .contact-row svg { 
      width: 24px; 
      height: 24px; 
      flex-shrink: 0; 
      color: var(--blue);
      transition: all .2s;
    }
    .contact-row:hover { 
      border-color: var(--blue);
      color: var(--blue);
      background: rgba(59, 130, 246, 0.1);
      transform: translateY(-3px);
    }
    .contact-row:hover svg { 
      color: var(--blue);
      transform: scale(1.1);
    }
    .contact-row span { display: block; }
    .contact-row:hover svg { color: var(--blue); }

    /* ── FOOTER ── */
    footer {
      padding: 3.5rem 0 4.5rem;
      text-align: center;
    }
    .footer-txt {
      font-size: .8rem;
      color: var(--ink-3);
    }

    /* ── UTILS ── */
    .fade {
      opacity: 0; transform: translateY(10px);
      transition: opacity .6s ease, transform .6s ease;
    }
    .fade.in { opacity: 1; transform: none; }

    @media (min-width: 1200px) {
      :root {
        --max: 1380px;
      }

      .container,
      .nav-inner {
        padding-left: 2.75rem;
        padding-right: 2.75rem;
      }

      .nav-inner {
        height: 64px;
      }

      .nav-name {
        font-size: 1.08rem;
      }

      .nav-links {
        gap: 1.6rem;
      }

      .nav-links a {
        font-size: 1rem;
      }

      .lang-sw button {
        font-size: .8rem;
        padding: .34rem .75rem;
      }

      .hero {
        padding: 6.5rem 0 4.5rem;
      }

      .hero-inner {
        gap: 4.5rem;
        align-items: center;
      }

      .hero-photo {
        width: 240px;
        height: 300px;
        border-radius: 20px;
      }

      .hero-name {
        font-size: 3.4rem;
        margin-bottom: 1.4rem;
        letter-spacing: 0.03em;
      }

      .hero-bio {
        font-size: 1.08rem;
        line-height: 1.75;
        max-width: 100%;
      }

      .section {
        padding: 4.5rem 0;
      }

      .section-title {
        font-size: 1.04rem;
        margin-bottom: 2.8rem;
      }

      .tl-item {
        grid-template-columns: 150px 1fr;
        gap: 0 2rem;
        padding: 1.35rem 0;
      }

      .tl-date {
        font-size: 0.97rem;
      }

      .tl-content h3 {
        font-size: 1.2rem;
      }

      .tl-content .where,
      .tl-content p,
      .cv-desc {
        font-size: 1.02rem;
      }

      .tl-content p {
        max-width: 800px;
      }

      .interests-grid {
        gap: .6rem;
      }

      .interest-chip {
        font-size: 0.98rem;
        padding: .65rem 1.3rem;
      }

      .cv-row {
        gap: 1.3rem;
      }

      .btn {
        font-size: .92rem;
        padding: .75rem 1.4rem;
      }

      .contact-links {
        grid-template-columns: repeat(5, 1fr);
        gap: .8rem;
      }

      .contact-row {
        aspect-ratio: 1.1;
        min-height: auto;
        padding: .8rem .65rem;
        gap: .45rem;
        font-size: .72rem;
        font-weight: 500;
      }

      .contact-row svg {
        width: 20px;
        height: 20px;
      }

      footer {
        padding: 3.5rem 0 4rem;
      }
    }

    @media (min-width: 1440px) {
      :root {
        --max: 1520px;
      }

      .container,
      .nav-inner {
        padding-left: 2.5rem;
        padding-right: 2.5rem;
      }

      .hero {
        padding: 6rem 0 4.5rem;
      }

      .hero-inner {
        display: flex;
        flex-direction: row;
        gap: 5rem;
        align-items: flex-start;
      }

      .hero-photo {
        width: 400px;
        height: 500px;
        border-radius: 22px;
        flex-shrink: 0;
        object-fit: cover;
        object-position: center;
        box-shadow: 0 16px 48px rgba(59, 130, 246, 0.32);
        border: 2px solid rgba(59, 130, 246, 0.3);
      }

      .hero-text {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }

      .hero-label {
        font-size: 1.08rem;
        margin-bottom: 1rem;
      }

      .hero-name {
        font-size: 3.6rem;
        line-height: 1;
        letter-spacing: 0.04em;
        margin-bottom: 1.5rem;
      }

      .hero-bio {
        font-size: 1.1rem;
        line-height: 1.75;
        max-width: 100%;
      }

      .hero-loc {
        font-size: 1.04rem;
        margin-top: 1.2rem;
      }

      .section {
        padding: 4.5rem 0;
      }

      .section-title {
        font-size: 1.1rem;
        margin-bottom: 2.8rem;
      }

      .tl-item {
        grid-template-columns: 155px 1fr;
        gap: 0 2.2rem;
        padding: 1.4rem 0;
      }

      .tl-date {
        font-size: 0.98rem;
      }

      .tl-tag {
        font-size: .7rem;
        padding: .28rem .7rem;
      }

      .tl-content h3 {
        font-size: 1.24rem;
      }

      .tl-content .where,
      .tl-content p,
      .cv-desc {
        font-size: 1.03rem;
      }

      .tl-content p {
        line-height: 1.7;
      }

      .interests-grid {
        gap: .6rem;
      }

      .interest-chip {
        font-size: 0.98rem;
        padding: .65rem 1.3rem;
      }

      .cv-row {
        gap: 1.3rem;
      }

      .cv-desc {
        font-size: 1.03rem;
      }

      .btn {
        font-size: .92rem;
        padding: .75rem 1.4rem;
      }

      .contact-links {
        grid-template-columns: repeat(5, 1fr);
        gap: .8rem;
      }

      .contact-row {
        aspect-ratio: auto;
        min-height: 100px;
        padding: 1rem .75rem;
        gap: .5rem;
        font-size: .78rem;
        font-weight: 500;
      }

      .contact-row svg {
        width: 24px;
        height: 24px;
      }

      footer {
        padding: 3.5rem 0 4rem;
      }
    }

    @media(max-width: 900px) {
      html { font-size: 16px; }
      .container { padding: 0 2rem; }
      .nav-inner { padding: 0 2rem; }
    }

    @media(max-width: 768px) {
      .container { padding: 0 1.5rem; }
      .nav-inner { padding: 0 1.5rem; }
      .hero-inner { flex-direction: column; gap: 2.5rem; align-items: center; }
      .hero-photo { width: 180px; height: 180px; }
      .hero-name { font-size: 2.8rem; }
      .hero-bio { font-size: 1.1rem; max-width: 100%; }
      .nav-links { display: none; }
      .tl-item { grid-template-columns: 110px 1fr; gap: 0 1.2rem; padding: 1.2rem 0; }
      .cv-row { flex-direction: column; align-items: flex-start; }
      .contact-links { grid-template-columns: repeat(3, 1fr); }
      .section { padding: 3.5rem 0; }
      .section-title { margin-bottom: 2.2rem; }
    }

    @media(max-width: 480px) {
      html { font-size: 15px; }
      .container { padding: 0 1rem; }
      .nav-inner { padding: 0 1rem; }
      .hero { padding: 2.5rem 0 2rem; }
      .hero-inner { gap: 1.5rem; }
      .hero-photo { width: 130px; height: 130px; }
      .hero-name { font-size: 1.8rem; margin-bottom: .7rem; }
      .hero-label { font-size: .8rem; margin-bottom: .4rem; }
      .hero-bio { font-size: 1rem; line-height: 1.6; }
      .hero-loc { font-size: .88rem; margin-top: .6rem; }
      .nav-name { font-size: .8rem; }
      .section { padding: 2.5rem 0; }
      .section-title { font-size: .85rem; margin-bottom: 1.5rem; }
      .tl-item { grid-template-columns: 70px 1fr; gap: 0 .6rem; padding: .7rem 0; }
      .tl-date { font-size: .85rem; }
      .tl-content h3 { font-size: 1rem; }
      .tl-content .where { font-size: .95rem; }
      .interest-chip { font-size: .88rem; padding: .35rem .75rem; }
      .btn { font-size: .82rem; padding: .5rem .95rem; }
      .contact-links { grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
      .contact-row { font-size: 0.68rem; padding: 0.65rem; gap: 0.45rem; }
      .contact-row svg { width: 20px; height: 20px; }
      .cv-btns { gap: .5rem; width: 100%; }
      .btn-primary, .btn-ghost { width: 100%; justify-content: center; }
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(59, 130, 246, 0.15), transparent 38%),
        linear-gradient(180deg, #0f1419 0%, #111827 100%);
      color: var(--ink);
    }

    .maintenance-wrap {
      width: min(92vw, 720px);
      padding: 2rem;
    }

    .maintenance-card {
      background: rgba(17, 24, 39, 0.82);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: clamp(2rem, 5vw, 4rem);
      text-align: center;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.5);
    }

    .maintenance-badge {
      display: inline-block;
      margin-bottom: 1.25rem;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.32);
      color: var(--blue);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .maintenance-card h1 {
      font-family: var(--serif);
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      line-height: 0.95;
      letter-spacing: 0.04em;
      margin-bottom: 1rem;
      color: var(--ink);
    }

    .maintenance-card p {
      max-width: 42ch;
      margin: 0 auto;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.8;
      color: var(--ink-2);
    }

    .maintenance-name {
      margin-top: 1.6rem;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
  </style>
</head>
<body>
  <main class="maintenance-wrap">
    <div class="maintenance-card">
      <div class="maintenance-badge">Out of service</div>
      <h1>Website temporarily unavailable</h1>
      <p>
        I’m taking a short break from this site and will be back soon.
        Thank you for your patience.
      </p>
      <div class="maintenance-name">Abdelhak Chellal</div>
    </div>
  </main>

  <script>
    document.title = 'Out of service';
  </script>
</body>
</html>
